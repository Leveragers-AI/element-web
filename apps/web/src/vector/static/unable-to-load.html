<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<head>
    <style type="text/css">
        /* By default, hide the custom IS stuff - enabled in JS */
        #custom_is,
        #is_url {
            display: none;
        }

        html {
            height: 100%;
        }

        body {
            background: #f9fafb;
            max-width: 680px;
            margin: auto;
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif,
                "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        .mx_Button {
            border: 0;
            border-radius: 4px;
            font-size: 18px;
            margin-left: 4px;
            margin-right: 4px;
            min-width: 80px;
            background-color: #03b381;
            color: #fff;
            cursor: pointer;
            padding: 12px 22px;
            word-break: break-word;
            text-decoration: none;
        }

        .mx_Center {
            justify-content: center;
        }

        .mx_ClearDecoration {
            text-decoration: none !important;
        }

        .mx_HomePage_header {
            color: #2e2f32;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mx_HomePage h3 {
            margin-top: 30px;
        }

        .mx_HomePage_col {
            display: flex;
            flex-direction: row;
        }

        .mx_HomePage_row {
            flex: 1 1 0;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .mx_HomePage_logo {
            margin-right: 20px;
            margin-top: -10px;
        }

        .mx_HomePage_container {
            display: block !important;
            margin: 10px 20px;
        }

        .mx_HomePage_errorContainer {
            display: none; /* shown in JS if needed */
            margin: 20px;
            border: 1px solid red;
            background-color: #ffb9b9;
            padding: 5px;
        }

        .mx_HomePage_container h1,
        .mx_HomePage_container h2,
        .mx_HomePage_container h3,
        .mx_HomePage_container h4 {
            font-weight: 600;
            margin-bottom: 32px;
        }

        .mx_Spacer {
            margin-top: 24px;
        }

        .mx_FooterLink {
            color: ##0dbd8b;
            text-decoration: none;
        }

        .mx_Subtext {
            font-size: 14px;
        }

        .mx_SubtextTop {
            margin-top: 32px;
        }

        @media screen and (max-width: 1120px) {
            body {
                font-size: 20px;
            }

            h1 {
                font-size: 20px;
            }

            h4 {
                font-size: 16px;
            }

            .mx_Button {
                font-size: 18px;
                padding: 14px 28px;
            }

            .mx_HomePage_header {
                justify-content: left;
            }

            .mx_Spacer {
                margin-top: 24px;
            }
        }
    </style>

    <meta name="apple-itunes-app" content="app-id=id1083446067" />
</head>

<body>
    <div class="mx_HomePage_errorContainer">
        <!-- populated by JS if needed -->
    </div>

    <div class="mx_HomePage_container">
        <div class="mx_HomePage_header">
            <span class="mx_HomePage_logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="42" height="42" fill="none" aria-label="Agents by Leveragers" role="img"><path d="M25.4887 0H2.51132C1.12436 0 0 1.12436 0 2.51132V25.4887C0 26.8756 1.12436 28 2.51132 28H25.4887C26.8756 28 28 26.8756 28 25.4887V2.51132C28 1.12436 26.8756 0 25.4887 0Z" fill="#2CF8E5"/><path d="M10.6581 5.47342C11.1541 4.97743 12.0029 5.32902 12.0029 6.03093V20.4271C12.0029 21.1692 12.9333 21.4994 13.4017 20.9243L19.7955 13.0689C20.2639 12.4938 21.1943 12.8253 21.1943 13.5662V21.9866C21.1943 22.4223 20.8415 22.7752 20.4058 22.7752H7.35569C6.91998 22.7752 6.56714 22.4223 6.56714 21.9866V10.7849C6.56714 10.6041 6.62992 10.4283 6.74419 10.2876L10.6581 5.47342Z" fill="#0A082B"/><path d="M19.2042 9.68116C20.4345 9.68116 21.4318 8.68386 21.4318 7.45362C21.4318 6.22338 20.4345 5.22607 19.2042 5.22607C17.974 5.22607 16.9767 6.22338 16.9767 7.45362C16.9767 8.68386 17.974 9.68116 19.2042 9.68116Z" fill="#0A082B"/></svg>
            </span>
            <h1>Unable to load</h1>
        </div>
        <div class="mx_HomePage_col">
            <div class="mx_HomePage_row">
                <div>
                    <h2 id="step1_heading">Agents by Leveragers can't load</h2>
                    <p>Something went wrong and Agents by Leveragers was unable to load.</p>
                </div>
            </div>
        </div>
        <div class="mx_HomePage_row mx_Center mx_Spacer">
            <p class="mx_Spacer">
                <a href="https://www.leveragers.com" target="_blank" class="mx_FooterLink"> Go to leveragers.com </a>
            </p>
        </div>
    </div>
</body>
